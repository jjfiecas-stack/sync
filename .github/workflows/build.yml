name: Build images

on:
  schedule:
    - cron: '0 * * * *'   # hourly  — upstream repo checks
    - cron: '0 0 * * *'   # daily   — action/image version updates
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # remove after June 2, 2026

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule != '0 0 * * *' }}
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        run: |
          SHA_FILE=".last_shas"
          touch $SHA_FILE
          INCLUDES="[]"

          fetch_sha() {
            local NAME="$1"
            local URL="$2"
            local TOKEN="$3"
            local SHA
            SHA=$(curl -sf \
              -H "User-Agent: github-actions" \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" | jq -r '.sha // empty')
            echo "$NAME $SHA"
          }

          # Fetch all SHAs in parallel
          fetch_sha "sootio_stremio_addon" "https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main"         "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_sootio_stremio_addon &
          fetch_sha "hdhub"                "https://api.github.com/repos/TheVolecitor/hdhub/commits/main"                 "${{ secrets.PAT }}"          > /tmp/sha_hdhub &
          fetch_sha "webstreamr_mbg"       "https://api.github.com/repos/newman2x/WebStreamrMBG/commits/main"             "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_webstreamr_mbg &
          wait

          process_repo() {
            local NAME="$1"
            local PRIVATE="$2"
            local SAFE_NAME="${NAME//[^a-z0-9]/_}"

            local RESULT
            RESULT=$(cat /tmp/sha_${SAFE_NAME} 2>/dev/null || true)
            local LATEST_SHA="${RESULT#* }"

            if [ -z "$LATEST_SHA" ]; then
              echo "Failed to fetch SHA for $NAME, skipping"
              return
            fi

            local STORED_SHA
            STORED_SHA=$(grep "^$NAME=" $SHA_FILE | cut -d= -f2)
            echo "$NAME: stored=$STORED_SHA latest=$LATEST_SHA"

            if [ "$LATEST_SHA" = "$STORED_SHA" ]; then
              echo "$NAME has no new commits, skipping"
              return
            fi

            echo "$NAME has new commits, adding to build matrix"
            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg name "$NAME" \
              --arg sha "$LATEST_SHA" \
              --arg private "$PRIVATE" \
              '. + [{"name":$name,"platforms":"linux/arm64","sha":$sha,"private":$private}]')

            if grep -q "^$NAME=" $SHA_FILE; then
              sed -i "s/^$NAME=.*/$NAME=$LATEST_SHA/" $SHA_FILE
            else
              echo "$NAME=$LATEST_SHA" >> $SHA_FILE
            fi
          }

          process_repo "sootio-stremio-addon" "false"
          process_repo "hdhub"                "true"
          process_repo "webstreamr-mbg"       "false"

          if [ "$(echo "$INCLUDES" | jq 'length')" -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            MATRIX=$(jq -cn --argjson includes "$INCLUDES" '{"include":$includes}')
          fi
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit SHA file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_shas
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "Update last SHAs [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Checkout sootio-stremio-addon
        if: ${{ matrix.name == 'sootio-stremio-addon' }}
        uses: actions/checkout@v6
        with:
          repository: sooti/sootio-stremio-addon
          ref: main
          path: _source
          submodules: false

      - name: Checkout hdhub
        if: ${{ matrix.name == 'hdhub' }}
        uses: actions/checkout@v6
        with:
          repository: TheVolecitor/hdhub
          ref: main
          token: ${{ secrets.PAT }}
          path: _source

      - name: Write Dockerfile for hdhub
        if: ${{ matrix.name == 'hdhub' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js
          EXPOSE 7000
          CMD ["node", "server.js"]
          EOF

      - name: Checkout webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        uses: actions/checkout@v6
        with:
          repository: newman2x/WebStreamrMBG
          ref: main
          path: _source

      - name: Write Dockerfile for webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:24-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY tsconfig.json ./
          COPY src ./src
          RUN npm run build

          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/dist ./dist
          ENV NODE_ENV=production
          ENV PORT=51546
          EXPOSE 51546
          CMD ["node", "dist/index.js"]
          EOF

      - uses: docker/build-push-action@v7
        with:
          context: _source
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}
          cache-from: type=registry,ref=ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest

  cleanup:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [sootio-stremio-addon, hdhub, webstreamr-mbg]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false

  update-versions:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and update versions
        run: |
          WORKFLOW=".github/workflows/build.yml"
          CHANGED=false

          # Returns the latest major tag (e.g. v6) for a given owner/repo
          get_latest_major() {
            local REPO="$1"
            local TAG
            TAG=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | jq -r '.tag_name // empty')
            # Strip patch/minor: v6.0.2 -> v6
            echo "${TAG%%.*}"
          }

          # Updates all occurrences of uses: action@vX in the workflow
          update_action() {
            local ACTION="$1"   # e.g. actions/checkout
            local REPO="$2"     # GitHub repo slug, same as ACTION in most cases
            local LATEST
            LATEST=$(get_latest_major "$REPO")
            if [ -z "$LATEST" ]; then
              echo "  [skip] could not fetch latest for $ACTION"
              return
            fi
            local CURRENT
            CURRENT=$(grep -oP "(?<=$(echo "$ACTION" | sed 's|/|\\/|g')@)v[0-9]+" "$WORKFLOW" \
              | sort -V | tail -1)
            if [ -z "$CURRENT" ]; then
              echo "  [skip] $ACTION not found in workflow"
              return
            fi
            if [ "$CURRENT" = "$LATEST" ]; then
              echo "  [ok]   $ACTION $CURRENT"
            else
              echo "  [bump] $ACTION  $CURRENT -> $LATEST"
              sed -i "s|${ACTION}@${CURRENT}|${ACTION}@${LATEST}|g" "$WORKFLOW"
              CHANGED=true
            fi
          }

          # Updates node:XX-alpine throughout the workflow (covers inline Dockerfiles)
          update_node() {
            local LATEST_MAJOR
            LATEST_MAJOR=$(curl -sf https://nodejs.org/dist/index.json \
              | jq -r '[.[] | select(.lts != false and .lts != null)]
                        | sort_by(.date) | reverse | .[0].version
                        | ltrimstr("v") | split(".") | .[0]')
            if [ -z "$LATEST_MAJOR" ]; then
              echo "  [skip] could not fetch latest Node LTS"
              return
            fi
            local CURRENT_MAJOR
            CURRENT_MAJOR=$(grep -oP 'node:\K[0-9]+(?=-alpine)' "$WORKFLOW" \
              | sort -rn | head -1)
            if [ -z "$CURRENT_MAJOR" ]; then
              echo "  [skip] no node:-alpine references found"
              return
            fi
            if [ "$CURRENT_MAJOR" = "$LATEST_MAJOR" ]; then
              echo "  [ok]   node:${CURRENT_MAJOR}-alpine"
            else
              echo "  [bump] node:${CURRENT_MAJOR}-alpine -> node:${LATEST_MAJOR}-alpine"
              sed -i "s|node:${CURRENT_MAJOR}-alpine|node:${LATEST_MAJOR}-alpine|g" "$WORKFLOW"
              CHANGED=true
            fi
          }

          echo "=== GitHub Actions ==="
          update_action "actions/checkout"                "actions/checkout"
          update_action "actions/delete-package-versions" "actions/delete-package-versions"
          update_action "docker/login-action"             "docker/login-action"
          update_action "docker/setup-qemu-action"        "docker/setup-qemu-action"
          update_action "docker/setup-buildx-action"      "docker/setup-buildx-action"
          update_action "docker/build-push-action"        "docker/build-push-action"

          echo "=== Node.js base image ==="
          update_node

          echo "CHANGED=$CHANGED" >> $GITHUB_ENV

      - name: Commit version updates
        if: ${{ env.CHANGED == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/build.yml
          git commit -m "chore: update action and image versions [skip ci]"
          git push origin ${{ github.ref_name }}
