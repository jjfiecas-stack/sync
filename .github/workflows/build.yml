name: Build images

on:
  schedule:
    - cron: '0 1-23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap x64 job: checks every upstream in one pass so the arm runners
  # only spin up when something actually changed.
  check:
    if: github.event.schedule != '0 0 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hdhub: ${{ steps.check.outputs.hdhub }}
      magnetio: ${{ steps.check.outputs.magnetio }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .last_shas
          sparse-checkout-cone-mode: false

      - name: Check upstreams
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          for pair in hdhub=TheVolecitor/hdhub magnetio=peterdsp/Magnetio; do
            key=${pair%%=*}
            repo=${pair#*=}

            sha=$(gh api "repos/$repo/commits/main" --jq .sha) || {
              echo "::warning::$key fetch failed"
              continue
            }

            grep -qx "$key=$sha" .last_shas 2>/dev/null || echo "$key=$sha" >> "$GITHUB_OUTPUT"
          done

  hdhub:
    needs: check
    if: needs.check.outputs.hdhub != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          repository: TheVolecitor/hdhub
          ref: ${{ needs.check.outputs.hdhub }}
          token: ${{ secrets.PAT }}
          path: _source
          persist-credentials: false

      - name: Write Dockerfile
        run: |
          rm -rf _source/.git

          cat > _source/Dockerfile << 'DOCKERFILE'
          FROM node:24-alpine

          WORKDIR /app

          COPY package*.json ./

          RUN --mount=type=cache,target=/root/.npm \
              npm ci --omit=dev --no-audit --no-fund

          COPY . .

          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js

          EXPOSE 7000

          CMD ["node", "server.js"]
          DOCKERFILE

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: _source
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/hdhub:latest
            ghcr.io/jjfiecas-stack/hdhub:${{ needs.check.outputs.hdhub }}
          cache-from: type=gha,scope=hdhub
          cache-to: type=gha,mode=max,scope=hdhub

      # A failed prune must never block recording the SHA, or it rebuilds every hour.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: hdhub
          package-type: container
          min-versions-to-keep: 2

  magnetio:
    needs: check
    if: needs.check.outputs.magnetio != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          repository: peterdsp/Magnetio
          ref: ${{ needs.check.outputs.magnetio }}
          token: ${{ secrets.PAT }}
          path: _source
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: _source/scraper
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/magnetio-scraper:latest
            ghcr.io/jjfiecas-stack/magnetio-scraper:${{ needs.check.outputs.magnetio }}
          cache-from: type=gha,scope=magnetio-scraper
          cache-to: type=gha,mode=max,scope=magnetio-scraper

      - uses: docker/build-push-action@v7
        with:
          context: _source/addon
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/magnetio-addon:latest
            ghcr.io/jjfiecas-stack/magnetio-addon:${{ needs.check.outputs.magnetio }}
          cache-from: type=gha,scope=magnetio-addon
          cache-to: type=gha,mode=max,scope=magnetio-addon

      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: magnetio-scraper
          package-type: container
          min-versions-to-keep: 2

      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: magnetio-addon
          package-type: container
          min-versions-to-keep: 2

  # One commit for everything that built, so the two builds can't race on .last_shas.
  record:
    needs: [check, hdhub, magnetio]
    if: ${{ !cancelled() && (needs.hdhub.result == 'success' || needs.magnetio.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Commit SHAs
        env:
          HDHUB_RESULT: ${{ needs.hdhub.result }}
          HDHUB_SHA: ${{ needs.check.outputs.hdhub }}
          MAGNETIO_RESULT: ${{ needs.magnetio.result }}
          MAGNETIO_SHA: ${{ needs.check.outputs.magnetio }}
        run: |
          touch .last_shas

          record() {
            sed -i "/^$1=/d" .last_shas
            echo "$1=$2" >> .last_shas
          }

          if [ "$HDHUB_RESULT" = success ]; then record hdhub "$HDHUB_SHA"; fi
          if [ "$MAGNETIO_RESULT" = success ]; then record magnetio "$MAGNETIO_SHA"; fi

          git add .last_shas
          git diff --cached --quiet && exit 0

          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -qm "chore: update last SHAs [skip ci]"

          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" &&
            git push -q origin "$GITHUB_REF_NAME" &&
            exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1

  update-versions:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Update action versions
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          F=.github/workflows/build.yml

          for a in \
            actions/checkout \
            actions/delete-package-versions \
            docker/login-action \
            docker/setup-buildx-action \
            docker/build-push-action
          do
            v=$(gh api "repos/$a/releases/latest" --jq .tag_name | grep -oP '^v[0-9]+') || continue
            sed -i -E "s|($a@)v[0-9]+|\1$v|g" "$F"
          done

          git diff --quiet && exit 0

          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -qam "chore: update action versions [skip ci]"

          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" &&
            git push -q origin "$GITHUB_REF_NAME" &&
            exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
