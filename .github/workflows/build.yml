name: Build images 
on:
  schedule:
    - cron: '0 * * * *'   # hourly  — upstream repo checks
    - cron: '0 0 * * *'   # daily   — action/image version updates
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # remove after June 2, 2026
concurrency:
  group: build-images
  cancel-in-progress: false
permissions:
  packages: write
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule != '0 0 * * *' }}
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for upstream changes
        id: check
        run: |
          SHA_FILE=".last_shas"
          touch "$SHA_FILE"
          INCLUDES="[]"
          fetch_sha() {
            local NAME="$1" URL="$2" TOKEN="$3"
            curl -sf --retry 3 --retry-delay 2 \
              -H "User-Agent: github-actions" \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" | jq -r '.sha // empty' > "/tmp/sha_${NAME//[^a-z0-9]/_}"
          }
          fetch_sha "sootio-stremio-addon" \
            "https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main" \
            "${{ secrets.GITHUB_TOKEN }}" &
          fetch_sha "hdhub" \
            "https://api.github.com/repos/TheVolecitor/hdhub/commits/main" \
            "${{ secrets.PAT }}" &
          fetch_sha "webstreamr-mbg" \
            "https://api.github.com/repos/newman2x/WebStreamrMBG/commits/main" \
            "${{ secrets.GITHUB_TOKEN }}" &
          wait
          process_repo() {
            local NAME="$1" PRIVATE="$2"
            local SAFE="${NAME//[^a-z0-9]/_}"
            local LATEST STORED
            LATEST=$(cat "/tmp/sha_${SAFE}" 2>/dev/null)
            if [ -z "$LATEST" ]; then
              echo "::warning::Failed to fetch SHA for $NAME, skipping"
              return
            fi
            STORED=$(grep "^${NAME}=" "$SHA_FILE" | cut -d= -f2)
            if [ "$LATEST" = "$STORED" ]; then
              echo "$NAME: up to date ($LATEST)"
              return
            fi
            echo "$NAME: new commit $LATEST (was: ${STORED:-none})"
            INCLUDES=$(jq -cn \
              --argjson cur "$INCLUDES" \
              --arg name "$NAME" --arg sha "$LATEST" --arg private "$PRIVATE" \
              '$cur + [{"name":$name,"platforms":"linux/arm64","sha":$sha,"private":$private}]')
            if grep -q "^${NAME}=" "$SHA_FILE"; then
              sed -i "s/^${NAME}=.*/${NAME}=${LATEST}/" "$SHA_FILE"
            else
              printf '%s=%s\n' "$NAME" "$LATEST" >> "$SHA_FILE"
            fi
          }
          process_repo "sootio-stremio-addon" "false"
          process_repo "hdhub"                "true"
          process_repo "webstreamr-mbg"       "false"
          if [ "$(jq 'length' <<< "$INCLUDES")" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            {
              echo "matrix<<EOF"
              jq -cn --argjson i "$INCLUDES" '{"include":$i}'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Commit SHA file
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_shas
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "chore: update last SHAs [skip ci]"
            git push origin "${{ github.ref_name }}"
          fi
  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Checkout sootio-stremio-addon
        if: ${{ matrix.name == 'sootio-stremio-addon' }}
        uses: actions/checkout@v7
        with:
          repository: sooti/sootio-stremio-addon
          ref: main
          path: _source
      - name: Checkout hdhub
        if: ${{ matrix.name == 'hdhub' }}
        uses: actions/checkout@v7
        with:
          repository: TheVolecitor/hdhub
          ref: main
          token: ${{ secrets.PAT }}
          path: _source
      - name: Write Dockerfile for hdhub
        if: ${{ matrix.name == 'hdhub' }}
        run: |
          cat > _source/Dockerfile << 'DOCKERFILE'
          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js
          EXPOSE 7000
          CMD ["node", "server.js"]
          DOCKERFILE
      - name: Checkout webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        uses: actions/checkout@v7
        with:
          repository: newman2x/WebStreamrMBG
          ref: main
          path: _source
      - name: Write Dockerfile for webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        run: |
          cat > _source/Dockerfile << 'DOCKERFILE'
          FROM node:24-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY tsconfig.json ./
          COPY src ./src
          RUN npm run build
          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/dist ./dist
          ENV NODE_ENV=production PORT=51546
          EXPOSE 51546
          CMD ["node", "dist/index.js"]
          DOCKERFILE
      - uses: docker/build-push-action@v7
        with:
          context: _source
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to:   type=gha,scope=${{ matrix.name }},mode=max
  cleanup:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [sootio-stremio-addon, hdhub, webstreamr-mbg]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
  update-versions:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
      - name: Check and update versions
        run: |
          WORKFLOW=".github/workflows/build.yml"
          CHANGED=false
          # Fetch all latest versions in parallel
          gh_latest_major() {
            curl -sf --retry 3 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$1/releases/latest" \
              | jq -r '.tag_name // empty' \
              | grep -oP '^v[0-9]+' \
              > "/tmp/ver_$(echo "$1" | tr '/' '_')"
          }
          gh_latest_major "actions/checkout"                &
          gh_latest_major "actions/delete-package-versions" &
          gh_latest_major "docker/login-action"             &
          gh_latest_major "docker/setup-qemu-action"        &
          gh_latest_major "docker/setup-buildx-action"      &
          gh_latest_major "docker/build-push-action"        &
          curl -sf --retry 3 https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.lts != false and .lts != null)]
                      | sort_by(.date) | reverse | .[0].version
                      | ltrimstr("v") | split(".") | .[0]' \
            > /tmp/ver_node &
          wait
          update_action() {
            local ACTION="$1" REPO="$2"
            local LATEST CURRENT
            LATEST=$(cat "/tmp/ver_$(echo "$REPO" | tr '/' '_')" 2>/dev/null)
            if [ -z "$LATEST" ]; then
              echo "  [skip] could not fetch latest for $ACTION"
              return
            fi
            CURRENT=$(grep -oP "(?<=$(echo "$ACTION" | sed 's|/|\\/|g')@)v[0-9]+" "$WORKFLOW" \
              | sort -V | tail -1)
            if [ -z "$CURRENT" ]; then
              echo "  [skip] $ACTION not found in workflow"
              return
            fi
            if [ "$CURRENT" = "$LATEST" ]; then
              echo "  [ok]   $ACTION @ $CURRENT"
            else
              echo "  [bump] $ACTION  $CURRENT -> $LATEST"
              sed -i "s|${ACTION}@${CURRENT}|${ACTION}@${LATEST}|g" "$WORKFLOW"
              CHANGED=true
            fi
          }
          update_node() {
            local LATEST CURRENT
            LATEST=$(cat /tmp/ver_node 2>/dev/null)
            if [ -z "$LATEST" ]; then
              echo "  [skip] could not fetch Node LTS version"
              return
            fi
            CURRENT=$(grep -oP 'node:\K[0-9]+(?=-alpine)' "$WORKFLOW" | sort -rn | head -1)
            if [ -z "$CURRENT" ]; then
              echo "  [skip] no node:-alpine references found"
              return
            fi
            if [ "$CURRENT" = "$LATEST" ]; then
              echo "  [ok]   node:${CURRENT}-alpine"
            else
              echo "  [bump] node:${CURRENT}-alpine -> node:${LATEST}-alpine"
              sed -i "s|node:${CURRENT}-alpine|node:${LATEST}-alpine|g" "$WORKFLOW"
              CHANGED=true
            fi
          }
          echo "=== GitHub Actions ==="
          update_action "actions/checkout"                "actions/checkout"
          update_action "actions/delete-package-versions" "actions/delete-package-versions"
          update_action "docker/login-action"             "docker/login-action"
          update_action "docker/setup-qemu-action"        "docker/setup-qemu-action"
          update_action "docker/setup-buildx-action"      "docker/setup-buildx-action"
          update_action "docker/build-push-action"        "docker/build-push-action"
          echo "=== Node.js base image ==="
          update_node
          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"
      - name: Commit version updates
        if: ${{ env.CHANGED == 'true' }}
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/build.yml
          git commit -m "chore: update action and image versions [skip ci]"
          git push origin "${{ github.ref_name }}"
