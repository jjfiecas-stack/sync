name: Build images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images (ignore SHA cache)'
        type: boolean
        default: false

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          SHA_FILE=".last_shas"
          touch "$SHA_FILE"
          INCLUDES="[]"

          fetch_sha() {
            local NAME="$1" URL="$2" TOKEN="$3"
            local SHA
            SHA=$(curl -sf \
              -H "User-Agent: github-actions" \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" | jq -r '.sha // empty')
            echo "$NAME $SHA"
          }

          fetch_sha "yastream"             "https://api.github.com/repos/hoangtamthai/yastream/commits/dev"           "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_yastream &
          fetch_sha "sootio-stremio-addon" "https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main"     "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_sootio_stremio_addon &
          fetch_sha "hdhub"                "https://api.github.com/repos/TheVolecitor/hdhub/commits/main"             "${{ secrets.PAT }}"          > /tmp/sha_hdhub &
          fetch_sha "webstreamr-mbg"       "https://api.github.com/repos/newman2x/WebStreamrMBG/commits/main"         "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_webstreamr_mbg &
          wait

          process_repo() {
            local NAME="$1" PRIVATE="$2"
            local SAFE_NAME="${NAME//[^a-z0-9]/_}"

            local RESULT LATEST_SHA
            RESULT=$(cat "/tmp/sha_${SAFE_NAME}" 2>/dev/null || true)
            LATEST_SHA="${RESULT#* }"

            if [ -z "$LATEST_SHA" ]; then
              echo "::warning::Failed to fetch SHA for $NAME, skipping"
              return
            fi

            local STORED_SHA
            STORED_SHA=$(grep "^$NAME=" "$SHA_FILE" | cut -d= -f2 || true)
            echo "$NAME: stored=$STORED_SHA latest=$LATEST_SHA"

            if [ "$LATEST_SHA" = "$STORED_SHA" ] && [ "$FORCE_REBUILD" != "true" ]; then
              echo "$NAME unchanged, skipping"
              return
            fi

            echo "$NAME → queuing build"
            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg name    "$NAME" \
              --arg sha     "$LATEST_SHA" \
              --arg private "$PRIVATE" \
              '. + [{"name":$name,"sha":$sha,"private":$private}]')

            if grep -q "^$NAME=" "$SHA_FILE"; then
              sed -i "s/^$NAME=.*/$NAME=$LATEST_SHA/" "$SHA_FILE"
            else
              echo "$NAME=$LATEST_SHA" >> "$SHA_FILE"
            fi
          }

          process_repo "yastream"             "false"
          process_repo "sootio-stremio-addon" "false"
          process_repo "hdhub"                "true"
          process_repo "webstreamr-mbg"       "false"

          if [ "$(echo "$INCLUDES" | jq 'length')" -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            MATRIX=$(jq -cn --argjson includes "$INCLUDES" '{"include":$includes}')
          fi

          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"     >> "$GITHUB_OUTPUT"
          echo "EOF"         >> "$GITHUB_OUTPUT"

      - name: Commit SHA file
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_shas
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "chore: update last SHAs [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # ── yastream ────────────────────────────────────────────────────────────
      - name: Checkout yastream
        if: matrix.name == 'yastream'
        uses: actions/checkout@v5
        with:
          repository: hoangtamthai/yastream
          ref: dev
          path: _source

      - name: Patch yastream Dockerfile
        if: matrix.name == 'yastream'
        run: |
          sed -i '/COPY --from=builder \/app\/data/a COPY --from=builder /app/drizzle ./drizzle' \
            _source/Dockerfile

      # ── sootio-stremio-addon ─────────────────────────────────────────────────
      - name: Checkout sootio-stremio-addon
        if: matrix.name == 'sootio-stremio-addon'
        uses: actions/checkout@v5
        with:
          repository: sooti/sootio-stremio-addon
          ref: main
          path: _source
          submodules: false

      # ── hdhub ────────────────────────────────────────────────────────────────
      - name: Checkout hdhub
        if: matrix.name == 'hdhub'
        uses: actions/checkout@v5
        with:
          repository: TheVolecitor/hdhub
          ref: main
          token: ${{ secrets.PAT }}
          path: _source

      - name: Write hdhub Dockerfile
        if: matrix.name == 'hdhub'
        run: |
          cat > _source/Dockerfile << 'EOF'
          # Run npm natively on the builder host (x86), avoid QEMU for package installs
          FROM --platform=$BUILDPLATFORM node:20-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js

          FROM node:20-alpine
          WORKDIR /app
          COPY --from=builder /app .
          EXPOSE 7000
          CMD ["node", "server.js"]
          EOF

      # ── webstreamr-mbg ───────────────────────────────────────────────────────
      - name: Checkout webstreamr-mbg
        if: matrix.name == 'webstreamr-mbg'
        uses: actions/checkout@v5
        with:
          repository: newman2x/WebStreamrMBG
          ref: main
          path: _source

      - name: Write webstreamr-mbg Dockerfile
        if: matrix.name == 'webstreamr-mbg'
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:24-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY tsconfig.json ./
          COPY src ./src
          RUN npm run build

          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/dist ./dist
          ENV NODE_ENV=production
          ENV PORT=51546
          EXPOSE 51546
          CMD ["node", "dist/index.js"]
          EOF

      # ── build & push ─────────────────────────────────────────────────────────
      - uses: docker/build-push-action@v7
        with:
          context: _source
          platforms: linux/arm64
          push: true
          provenance: false
          no-cache: ${{ inputs.force_rebuild || false }}
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}
          cache-from: type=registry,ref=ghcr.io/jjfiecas-stack/${{ matrix.name }}:cache
          cache-to:   type=registry,ref=ghcr.io/jjfiecas-stack/${{ matrix.name }}:cache,mode=max

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, build]
    if: needs.build.result == 'success'
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [yastream, sootio-stremio-addon, hdhub, webstreamr-mbg]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
