name: Build images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        run: |
          SHA_FILE=".last_shas"
          touch $SHA_FILE
          INCLUDES="[]"

          fetch_sha() {
            local NAME="$1"
            local URL="$2"
            local TOKEN="$3"
            local SHA
            SHA=$(curl -sf \
              -H "User-Agent: github-actions" \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" | jq -r '.sha // empty')
            echo "$NAME $SHA"
          }

          # Fetch all SHAs in parallel
          declare -A PIDS RESULTS
          fetch_sha "yastream"             "https://api.github.com/repos/hoangtamthai/yastream/commits/dev"                  "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_yastream &
          fetch_sha "sootio-stremio-addon" "https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main"            "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_sootio_stremio_addon &
          fetch_sha "hdhub"                "https://api.github.com/repos/TheVolecitor/hdhub/commits/main"                    "${{ secrets.PAT }}"          > /tmp/sha_hdhub &
          fetch_sha "webstreamr-mbg"       "https://api.github.com/repos/newman2x/WebStreamrMBG/commits/main"                "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_webstreamr_mbg &
          fetch_sha "selfstream"           "https://api.github.com/repos/qwertyuiop8899/SelfStream/commits/main"             "${{ secrets.GITHUB_TOKEN }}" > /tmp/sha_selfstream &
          wait

          process_repo() {
            local NAME="$1"
            local PRIVATE="$2"
            local CHECKOUT="$3"
            local CONTEXT="$4"
            local SAFE_NAME="${NAME//[^a-z0-9]/_}"

            local RESULT
            RESULT=$(cat /tmp/sha_${SAFE_NAME} 2>/dev/null || true)
            local LATEST_SHA="${RESULT#* }"

            if [ -z "$LATEST_SHA" ]; then
              echo "Failed to fetch SHA for $NAME, skipping"
              return
            fi

            local STORED_SHA
            STORED_SHA=$(grep "^$NAME=" $SHA_FILE | cut -d= -f2)
            echo "$NAME: stored=$STORED_SHA latest=$LATEST_SHA"

            if [ "$LATEST_SHA" = "$STORED_SHA" ]; then
              echo "$NAME has no new commits, skipping"
              return
            fi

            echo "$NAME has new commits, adding to build matrix"
            INCLUDES=$(echo "$INCLUDES" | jq -c \
              --arg name "$NAME" \
              --arg context "$CONTEXT" \
              --arg sha "$LATEST_SHA" \
              --arg private "$PRIVATE" \
              --arg checkout "$CHECKOUT" \
              '. + [{"name":$name,"context":$context,"platforms":"linux/arm64","sha":$sha,"private":$private,"checkout":$checkout}]')

            if grep -q "^$NAME=" $SHA_FILE; then
              sed -i "s/^$NAME=.*/$NAME=$LATEST_SHA/" $SHA_FILE
            else
              echo "$NAME=$LATEST_SHA" >> $SHA_FILE
            fi
          }

          process_repo "yastream"             "false" "true"  "https://github.com/hoangtamthai/yastream.git#dev"
          process_repo "sootio-stremio-addon" "false" "true"  "https://github.com/sooti/sootio-stremio-addon.git#main"
          process_repo "hdhub"                "true"  "false" "https://github.com/TheVolecitor/hdhub.git#main"
          process_repo "webstreamr-mbg"       "false" "true"  "https://github.com/newman2x/WebStreamrMBG.git#main"
          process_repo "selfstream"           "false" "true"  "https://github.com/qwertyuiop8899/SelfStream.git#main"

          if [ "$(echo "$INCLUDES" | jq 'length')" -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            MATRIX=$(jq -cn --argjson includes "$INCLUDES" '{"include":$includes}')
          fi
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit SHA file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_shas
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "Update last SHAs [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Checkout yastream
        if: ${{ matrix.name == 'yastream' }}
        uses: actions/checkout@v5
        with:
          repository: hoangtamthai/yastream
          ref: dev
          path: _source

      - name: Patch Dockerfile for yastream
        if: ${{ matrix.name == 'yastream' }}
        run: |
          sed -i '/COPY --from=builder \/app\/data/a COPY --from=builder /app/drizzle ./drizzle' _source/Dockerfile

      - name: Checkout sootio-stremio-addon
        if: ${{ matrix.name == 'sootio-stremio-addon' }}
        uses: actions/checkout@v5
        with:
          repository: sooti/sootio-stremio-addon
          ref: main
          path: _source
          submodules: false

      - name: Checkout private repo
        if: ${{ matrix.private == 'true' && matrix.name == 'hdhub' }}
        uses: actions/checkout@v5
        with:
          repository: TheVolecitor/hdhub
          ref: main
          token: ${{ secrets.PAT }}
          path: _source

      - name: Write Dockerfile for hdhub
        if: ${{ matrix.name == 'hdhub' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js
          EXPOSE 7000
          CMD ["node", "server.js"]
          EOF

      - name: Checkout webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        uses: actions/checkout@v5
        with:
          repository: newman2x/WebStreamrMBG
          ref: main
          path: _source

      - name: Write Dockerfile for webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:24-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY tsconfig.json ./
          COPY src ./src
          RUN npm run build

          FROM node:24-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/dist ./dist
          ENV NODE_ENV=production
          ENV PORT=51546
          EXPOSE 51546
          CMD ["node", "dist/index.js"]
          EOF

      - name: Checkout selfstream
        if: ${{ matrix.name == 'selfstream' }}
        uses: actions/checkout@v5
        with:
          repository: qwertyuiop8899/SelfStream
          ref: main
          path: _source

      - name: Write Dockerfile for selfstream
        if: ${{ matrix.name == 'selfstream' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY . .
          RUN npm ci && npm run build

          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/dist ./dist
          ENV PORT=7020
          EXPOSE 7020
          CMD ["node", "dist/addon.js"]
          EOF

      - uses: docker/build-push-action@v7
        with:
          context: ${{ (matrix.private == 'true' || matrix.checkout == 'true') && '_source' || matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}
          cache-from: type=registry,ref=ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest

  cleanup:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.build.result == 'success' }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [yastream, sootio-stremio-addon, hdhub, webstreamr-mbg, selfstream]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
