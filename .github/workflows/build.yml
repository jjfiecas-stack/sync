name: Build images
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  packages: write
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for upstream changes
        id: check
        run: |
          declare -A REPOS
          REPOS[yastream]="https://api.github.com/repos/hoangtamthai/yastream/commits/dev"
          REPOS[sootio-stremio-addon]="https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main"
          REPOS[nuvio-streams-addon]="https://api.github.com/repos/tapframe/NuvioStreamsAddon/commits/master"
          SHA_FILE=".last_shas"
          touch $SHA_FILE
          INCLUDES="[]"
          for NAME in "${!REPOS[@]}"; do
            URL="${REPOS[$NAME]}"
            LATEST_SHA=$(curl -s \
              -H "User-Agent: github-actions" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "$URL" | jq -r '.sha // empty')
            if [ -z "$LATEST_SHA" ]; then
              echo "Failed to fetch SHA for $NAME, skipping"
              continue
            fi
            STORED_SHA=$(grep "^$NAME=" $SHA_FILE | cut -d= -f2)
            if [ "$LATEST_SHA" != "$STORED_SHA" ]; then
              echo "$NAME has new commits, adding to build matrix"
              case $NAME in
                yastream)
                  INCLUDES=$(echo $INCLUDES | jq ". + [{\"name\":\"yastream\",\"context\":\"https://github.com/hoangtamthai/yastream.git#main\",\"platforms\":\"linux/amd64,linux/arm64\"}]")
                  ;;
                sootio-stremio-addon)
                  INCLUDES=$(echo $INCLUDES | jq ". + [{\"name\":\"sootio-stremio-addon\",\"context\":\"https://github.com/sooti/sootio-stremio-addon.git#main\",\"platforms\":\"linux/amd64\"}]")
                  ;;
                nuvio-streams-addon)
                  INCLUDES=$(echo $INCLUDES | jq ". + [{\"name\":\"nuvio-streams-addon\",\"context\":\"https://github.com/tapframe/NuvioStreamsAddon.git#master\",\"platforms\":\"linux/amd64,linux/arm64\"}]")
                  ;;
              esac
              if grep -q "^$NAME=" $SHA_FILE; then
                sed -i "s/^$NAME=.*/$NAME=$LATEST_SHA/" $SHA_FILE
              else
                echo "$NAME=$LATEST_SHA" >> $SHA_FILE
              fi
            else
              echo "$NAME has no new commits, skipping"
            fi
          done
          echo "matrix={\"include\":$INCLUDES}" >> $GITHUB_OUTPUT
      - name: Commit SHA file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .last_shas
          git diff --staged --quiet || git commit -m "Update last SHAs [skip ci]"
          git push
  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
          no-cache: true
  cleanup:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [yastream, sootio-stremio-addon, nuvio-streams-addon]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
