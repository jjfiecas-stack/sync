name: Build images

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      hdhub_sha: ${{ steps.hdhub.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get HDHub SHA
        id: hdhub
        run: |
          SHA=$(git ls-remote https://github.com/TheVolecitor/hdhub.git refs/heads/main | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "HDHub SHA: $SHA"

  process_repo:
    needs: check
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read previous SHAs
        id: previous
        run: |
          if [ -f .last_shas ]; then
            cat .last_shas
          else
            touch .last_shas
          fi

      - name: Build matrix
        id: matrix
        env:
          HDHUB_SHA: ${{ needs.check.outputs.hdhub_sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          previous = {}

          if Path(".last_shas").exists():
              for line in Path(".last_shas").read_text().splitlines():
                  line = line.strip()

                  if not line or "=" not in line:
                      continue

                  key, value = line.split("=", 1)
                  previous[key.strip()] = value.strip()

          current = {
              "hdhub": os.environ["HDHUB_SHA"],
          }

          repos = {
              "hdhub": {
                  "sha_key": "hdhub",
                  "repository": "TheVolecitor/hdhub",
                  "context": ".",
                  "dockerfile": "Dockerfile",
                  "platforms": "linux/arm64",
                  "private": "false",
              },
          }

          matrix = []

          for name, repo in repos.items():
              sha = current[name]

              if previous.get(repo["sha_key"]) != sha:
                  matrix.append({
                      "name": name,
                      "repository": repo["repository"],
                      "sha": sha,
                      "private": repo["private"],
                      "context": repo["context"],
                      "dockerfile": repo["dockerfile"],
                      "platforms": repo["platforms"],
                  })

          output = {
              "include": matrix
          }

          print(json.dumps(output, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(output) + "\n")
          PY

  build:
    needs:
      - check
      - process_repo

    if: needs.process_repo.outputs.matrix != '{"include":[]}'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.process_repo.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          fetch-depth: 1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare HDHub Dockerfile
        if: matrix.name == 'hdhub'
        run: |
          cat > Dockerfile.custom <<'EOF'
          FROM node:22-alpine

          WORKDIR /app

          COPY package*.json ./
          RUN npm ci --omit=dev

          COPY . .

          EXPOSE 7000

          CMD ["node", "server.js"]
          EOF

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: Dockerfile.custom
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-sha-file:
    needs:
      - check
      - process_repo
      - build

    if: needs.process_repo.outputs.matrix != '{"include":[]}'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SHAs
        run: |
          cat > .last_shas <<EOF
          hdhub=${{ needs.check.outputs.hdhub_sha }}
          EOF

      - name: Commit SHA changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .last_shas

          if git diff --cached --quiet; then
            echo "No SHA changes to commit."
            exit 0
          fi

          git commit -m "Update HDHub SHA"
          git push

  cleanup:
    needs:
      - build

    if: needs.build.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old HDHub package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: hdhub
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false

  update-versions:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update action versions
        run: |
          sed -i \
            -e 's/actions\/checkout@v[0-9]*/actions\/checkout@v4/g' \
            -e 's/docker\/login-action@v[0-9]*/docker\/login-action@v4/g' \
            -e 's/docker\/setup-qemu-action@v[0-9]*/docker\/setup-qemu-action@v4/g' \
            -e 's/docker\/setup-buildx-action@v[0-9]*/docker\/setup-buildx-action@v4/g' \
            -e 's/docker\/build-push-action@v[0-9]*/docker\/build-push-action@v7/g' \
            -e 's/actions\/delete-package-versions@v[0-9]*/actions\/delete-package-versions@v5/g' \
            .github/workflows/build.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/build.yml

          if git diff --cached --quiet; then
            echo "No workflow changes."
            exit 0
          fi

          git commit -m "Update workflow versions"
          git push
