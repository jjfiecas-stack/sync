name: Build images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  packages: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        run: |
          declare -A REPOS
          REPOS[yastream]="https://api.github.com/repos/hoangtamthai/yastream/commits/dev"
          REPOS[sootio-stremio-addon]="https://api.github.com/repos/sooti/sootio-stremio-addon/commits/main"
          REPOS[nuvio-streams-addon]="https://api.github.com/repos/tapframe/NuvioStreamsAddon/commits/master"
          REPOS[hdhub]="https://api.github.com/repos/TheVolecitor/hdhub/commits/main"
          REPOS[webstreamr-mbg]="https://api.github.com/repos/newman2x/WebStreamrMBG/commits/main"

          SHA_FILE=".last_shas"
          touch $SHA_FILE
          INCLUDES="[]"

          for NAME in "${!REPOS[@]}"; do
            URL="${REPOS[$NAME]}"

            if [ "$NAME" = "hdhub" ]; then
              LATEST_SHA=$(curl -s \
                -H "User-Agent: github-actions" \
                -H "Authorization: Bearer ${{ secrets.PAT }}" \
                "$URL" | jq -r '.sha // empty')
            else
              LATEST_SHA=$(curl -s \
                -H "User-Agent: github-actions" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "$URL" | jq -r '.sha // empty')
            fi

            if [ -z "$LATEST_SHA" ]; then
              echo "Failed to fetch SHA for $NAME, skipping"
              continue
            fi

            STORED_SHA=$(grep "^$NAME=" $SHA_FILE | cut -d= -f2)
            echo "$NAME: stored=$STORED_SHA latest=$LATEST_SHA"

            if [ "$LATEST_SHA" != "$STORED_SHA" ]; then
              echo "$NAME has new commits, adding to build matrix"
              case $NAME in
                yastream)
                  INCLUDES=$(echo "$INCLUDES" | jq -c '. + [{"name":"yastream","context":"https://github.com/hoangtamthai/yastream.git#dev","platforms":"linux/arm64","sha":"'"$LATEST_SHA"'","private":"false","checkout":"false"}]')
                  ;;
                sootio-stremio-addon)
                  INCLUDES=$(echo "$INCLUDES" | jq -c '. + [{"name":"sootio-stremio-addon","context":"https://github.com/sooti/sootio-stremio-addon.git#main","platforms":"linux/arm64","sha":"'"$LATEST_SHA"'","private":"false","checkout":"false"}]')
                  ;;
                nuvio-streams-addon)
                  INCLUDES=$(echo "$INCLUDES" | jq -c '. + [{"name":"nuvio-streams-addon","context":"https://github.com/tapframe/NuvioStreamsAddon.git#master","platforms":"linux/arm64","sha":"'"$LATEST_SHA"'","private":"false","checkout":"false"}]')
                  ;;
                hdhub)
                  INCLUDES=$(echo "$INCLUDES" | jq -c '. + [{"name":"hdhub","context":"https://github.com/TheVolecitor/hdhub.git#main","platforms":"linux/arm64","sha":"'"$LATEST_SHA"'","private":"true","checkout":"false"}]')
                  ;;
                webstreamr-mbg)
                  INCLUDES=$(echo "$INCLUDES" | jq -c '. + [{"name":"webstreamr-mbg","context":"https://github.com/newman2x/WebStreamrMBG.git#main","platforms":"linux/arm64","sha":"'"$LATEST_SHA"'","private":"false","checkout":"true"}]')
                  ;;
              esac

              if grep -q "^$NAME=" $SHA_FILE; then
                sed -i "s/^$NAME=.*/$NAME=$LATEST_SHA/" $SHA_FILE
              else
                echo "$NAME=$LATEST_SHA" >> $SHA_FILE
              fi
            else
              echo "$NAME has no new commits, skipping"
            fi
          done

          if [ "$(echo "$INCLUDES" | jq 'length')" -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            MATRIX=$(jq -cn --argjson includes "$INCLUDES" '{"include":$includes}')
          fi
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit SHA file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git stash || true
          git pull --rebase origin ${{ github.ref_name }}
          git stash pop || true
          git add .last_shas
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "Update last SHAs [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Checkout private repo
        if: ${{ matrix.private == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: TheVolecitor/hdhub
          ref: main
          token: ${{ secrets.PAT }}
          path: _source

      - name: Write Dockerfile for hdhub
        if: ${{ matrix.private == 'true' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          RUN sed -i 's/127\.0\.0\.1/0.0.0.0/g' server.js
          EXPOSE 7000
          CMD ["node", "server.js"]
          EOF

      - name: Checkout public repo for local build
        if: ${{ matrix.checkout == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: newman2x/WebStreamrMBG
          ref: main
          path: _source

      - name: Write Dockerfile for webstreamr-mbg
        if: ${{ matrix.name == 'webstreamr-mbg' }}
        run: |
          cat > _source/Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY . .
          EXPOSE 7000
          CMD ["node", "server.js"]
          EOF

      - uses: docker/build-push-action@v5
        with:
          context: ${{ (matrix.private == 'true' || matrix.checkout == 'true') && '_source' || matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
            ghcr.io/jjfiecas-stack/${{ matrix.name }}:${{ matrix.sha }}

  cleanup:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.check.outputs.matrix != '' && fromJson(needs.check.outputs.matrix).include[0] != null }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
