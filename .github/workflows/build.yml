name: Build images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yastream
            context: https://github.com/hoangtamthai/yastream.git
          - name: sootio-stremio-addon
            context: https://github.com/sooti/sootio-stremio-addon.git
          - name: nuvio-streams-addon
            context: https://github.com/tapframe/NuvioStreamsAddon.git
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jjfiecas-stack/${{ matrix.name }}:latest
          no-cache: true
